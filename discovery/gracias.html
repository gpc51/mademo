<style>
  :root {
    --orange:     #d84200;
    --orange-h:   #f04900;
    --orange-bg:  rgba(216,66,0,.08);
    --orange-bd:  rgba(216,66,0,.28);
    --black:      #111213;
    --dark:       #1a1c1e;
    --gray-d:     #3e4245;
    --gray:       #636870;
    --gray-l:     #9ba3ab;
    --border:     #e4e7ea;
    --bg:         #f7f8f9;
    --white:      #ffffff;
    --font:       'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --r:          6px;
    --r-lg:       10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--font);color:var(--dark);background:var(--bg);font-size:15px;line-height:1.7;}
  a{color:inherit;}

  /* ── NAV ── */
  .nav{
    position:sticky;top:0;z-index:100;
    background:rgba(247,248,249,.92);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:1000px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 32px;
  }
  .nav-logo{display:flex;align-items:center;gap:0;}
  .nav-logo img{height:26px;width:auto;display:block;}

  /* ── LAYOUT ── */
  .wrap{max-width:1000px;margin:0 auto;padding:0 32px;}

  /* ── CONFIRM ── */
  .confirm{padding:64px 0 40px;}
  .confirm-check{
    width:52px;height:52px;border-radius:50%;
    background:var(--orange-bg);border:1.5px solid var(--orange-bd);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .confirm-check svg{width:26px;height:26px;color:var(--orange);}
  .confirm-title{
    font-size:34px;font-weight:800;letter-spacing:-.03em;
    color:var(--black);margin-bottom:12px;line-height:1.15;
  }
  .confirm-sub{
    font-size:17px;color:var(--gray);line-height:1.6;
    max-width:560px;
  }

  /* ── CAL EMBED ── */
  .cal-wrap{padding:24px 0 64px;}
  #cal-booking-embed{
    min-height:700px;
    border-radius:var(--r-lg);
    overflow:hidden;
  }

  /* ── FOOTER ── */
  .footer{background:var(--dark);color:rgba(255,255,255,.4);padding:34px 0;}
  .footer-inner{
    max-width:1000px;margin:0 auto;padding:0 32px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .footer-logo{display:inline-flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:inherit;cursor:pointer;}
  .footer-brand img{height:24px;width:auto;display:block;margin-bottom:6px;filter:brightness(0) invert(1);opacity:.85;}
  .footer-brand span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .footer-mail a{color:var(--orange-h);text-decoration:none;font-size:13px;font-weight:600;}

  /* ── RESPONSIVE ── */
  @media(max-width:600px){
    .nav-inner,.wrap,.footer-inner{padding-left:20px;padding-right:20px;}
    .confirm{padding:44px 0 28px;}
    .confirm-title{font-size:26px;}
    .confirm-sub{font-size:15px;}
    .footer-inner{flex-direction:column;align-items:flex-start;}
  }
</style>

  <div class="nav-inner">

      <img src="../assets/logo.svg" alt="Made" height="26"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

  </div>
</div>

<!-- ══ FOOTER ══ -->
<footer class="footer">

    <div class="footer-brand">
      <a class="footer-logo" href="https://www.madeos.ai" target="_blank" rel="noopener" aria-label="Ir a madeos.ai">
        <img src="../assets/logo.svg" alt="Made" height="24"
             onerror="this.style.display='none'">
