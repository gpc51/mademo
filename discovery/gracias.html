<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made OS · Gracias</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange:     #d84200;
    --orange-h:   #f04900;
    --orange-bg:  rgba(216,66,0,.08);
    --orange-bd:  rgba(216,66,0,.28);
    --black:      #111213;
    --dark:       #1a1c1e;
    --gray:       #636870;
    --border:     #e4e7ea;
    --bg:         #f7f8f9;
    --cal-dark:   #18181b;
    --font:       'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --r:          6px;
    --r-lg:       10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100dvh;overflow:hidden;}
  body{
    font-family:var(--font);font-size:15px;line-height:1.7;
    display:flex;flex-direction:column;
    background:var(--bg);
  }
  a{color:inherit;}

  /* ── NAV ── */
  .nav{
    flex-shrink:0;
    background:rgba(247,248,249,.96);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:1000px;margin:0 auto;
    display:flex;align-items:center;
    padding:13px 32px;
  }
  .nav-logo{display:flex;align-items:center;}
  .nav-logo img{height:24px;width:auto;display:block;}

  /* ── CONFIRM (alto determinado por su contenido, sin flex:1) ── */
  .page-top{
    flex-shrink:0;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .confirm-inner{
    max-width:1000px;margin:0 auto;
    padding:40px 40px;
    display:flex;align-items:center;gap:18px;
  }
  .confirm-check{
    flex-shrink:0;
    width:42px;height:42px;border-radius:50%;
    background:var(--orange-bg);border:1.5px solid var(--orange-bd);
    display:flex;align-items:center;justify-content:center;
  }
  .confirm-check svg{width:21px;height:21px;color:var(--orange);}
  .confirm-title{
    font-size:20px;font-weight:800;letter-spacing:-.025em;
    color:var(--black);line-height:1.2;margin-bottom:3px;
  }
  .confirm-sub{font-size:13.5px;color:var(--gray);line-height:1.5;max-width:520px;}

  /* ── PANEL OSCURO: toma todo el resto ── */
  .page-bottom{
    flex:1;min-height:0;
    display:flex;flex-direction:column;
    background:var(--cal-dark);
  }

  /* ── CAL EMBED ── */
  .cal-wrap{
    flex:1;min-height:0;
    padding:20px 32px 0;
    display:flex;flex-direction:column;
  }
  .cal-inner{
    flex:1;min-height:0;
    max-width:960px;width:100%;margin:0 auto;
    overflow:hidden; /* clip el watermark del iframe */
    border-radius:var(--r-lg) var(--r-lg) 0 0;
  }
  #cal-booking-embed{
    height:100%;
  }
  /* Empuja el iframe para sacar el watermark de Cal.com del viewport */
  #cal-booking-embed iframe{
    height:calc(100% + 90px) !important;
    max-height:none !important;
    display:block;
  }

  /* ── FOOTER ── */
  .footer{
    flex-shrink:0;
    background:transparent;
    color:rgba(255,255,255,.28);
    padding:11px 0;
  }
  .footer-inner{
    max-width:960px;margin:0 auto;padding:0 32px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .footer-logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;}
  .footer-brand img{height:18px;width:auto;display:block;filter:brightness(0) invert(1);opacity:.55;}
  .footer-brand span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .footer-mail a{color:var(--orange-h);text-decoration:none;font-size:12px;font-weight:600;}

  /* ── RESPONSIVE ── */
  @media(max-width:700px){
    html,body{height:auto;overflow:auto;}
    .page-bottom{flex:none;}
    .confirm-inner,.cal-wrap,.footer-inner{padding-left:20px;padding-right:20px;}
    .confirm-title{font-size:18px;}
    .cal-wrap{padding-top:12px;}
    .cal-inner{overflow:hidden;border-radius:var(--r-lg);height:540px;}
    #cal-booking-embed{height:100%;}
    .footer-inner{flex-direction:column;align-items:flex-start;gap:6px;}
  }
</style>

    </div>
  </div>
</div>

<div class="page-bottom">

  <div class="cal-wrap">
    <div class="cal-inner">
      <div id="cal-booking-embed"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <a class="footer-logo" href="https://www.madeos.ai" target="_blank" rel="noopener" aria-label="Ir a madeos.ai">
          <img src="../assets/logo.svg" alt="Made" height="18"
               onerror="this.style.display='none'">
        </a>
      </div>
      <div class="footer-mail">
        <a href="mailto:g@madeos.ai">g@madeos.ai</a>
      </div>
    </div>
  </footer>

</div>
