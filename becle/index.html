<style>
:root{--bone:#F7F6EF;--ink:#111;--orange:#FF6B2C;--muted:rgba(247,246,239,.72);--line:rgba(247,246,239,.28)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--bone);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;padding:16px;background:linear-gradient(90deg,rgba(10,12,12,.95),rgba(10,12,12,.78)),url('assets/bg-cuervo-01-cover.jpg') center/cover no-repeat #0d0f0f}
main{width:100%;max-width:460px}
svg{width:120px;height:auto;display:block;margin-bottom:44px;color:var(--bone)}
.k{font:500 13px/1.4 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
h1{font:600 38px/1.05 'IBM Plex Sans Condensed','Arial Narrow',sans-serif;margin:12px 0 12px}
p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 28px}
form{display:flex;gap:10px}
input{flex:1;min-width:0;background:rgba(247,246,239,.08);border:1px solid var(--line);padding:14px 16px;color:var(--bone);font:500 18px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
input:focus{outline:2px solid var(--orange);outline-offset:2px}
button{background:var(--orange);color:var(--ink);border:0;padding:0 22px;font:600 16px Inter,Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--orange);font-size:15px;margin:14px 0 0;min-height:22px}
small{display:block;margin-top:36px;color:var(--muted);font-size:13px}
</style>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function open_(code){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);

  document.open();document.write(html);document.close();

const f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),err=document.getElementById('err');
