<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Made | Presentaciones</title>
  <style>
    :root { --ink:#182126; --muted:#68757a; --paper:#f5f4ef; --orange:#e84700; --line:#dce1df; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(1180px,calc(100% - 48px)); margin:auto; padding:88px 0; }
    .eyebrow { color:var(--orange); font-size:12px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    h1 { max-width:850px; margin:20px 0 52px; font-size:clamp(48px,7vw,92px); line-height:1; letter-spacing:-.06em; }
    .list { border-top:1px solid var(--line); }
    a { display:grid; grid-template-columns:120px 1fr auto; gap:24px; align-items:center; padding:27px 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
    a:hover { color:var(--orange); }
    .label { color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .title { font-size:clamp(24px,3vw,42px); font-weight:850; letter-spacing:-.04em; }
    .arrow { color:var(--orange); font-size:28px; }
    @media(max-width:600px) { main{width:min(100% - 32px,1180px);padding:54px 0;} a{grid-template-columns:1fr auto;gap:10px;} .label{grid-column:1/-1;} }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Made</span>
    <h1>Presentaciones ejecutivas.</h1>
    <div class="list">
      <a href="bhp-escondida/">
        <span class="label">Open Aster 2026</span>
        <span class="title">BHP Escondida · Contaminación por polvo en motores</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </main>
</body>
</html>
