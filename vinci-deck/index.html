<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Made OS · for VINCI</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--bg:#0b0f10;--paper:#f4f5f0;--muted:#c1c9c5;--dim:#8f9893;--line:#ffffff26;--orange:#ff7751;--mint:#b3e8d0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;padding:16px;background:linear-gradient(90deg,#0b0f10f2,#0b0f10b3),url('assets/bg-cover.jpg') center/cover no-repeat}
main{width:100%;max-width:440px}
img{height:30px;display:block;margin-bottom:44px}
.k{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
h1{font-size:40px;font-weight:580;letter-spacing:-.03em;line-height:1.05;margin:12px 0 10px}
p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 28px}
form{display:flex;gap:10px}
input{flex:1;min-width:0;background:#ffffff0f;border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--paper);font:500 18px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
input:focus{outline:2px solid var(--mint);outline-offset:2px}
button{background:var(--orange);color:#0b0f10;border:0;border-radius:8px;padding:0 22px;font:600 16px Inter,Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--orange);font-size:15px;margin:14px 0 0;min-height:22px}
small{display:block;margin-top:36px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<main>
  <img src="assets/logo.png" alt="Made">
  <div class="k">Prepared for Leonard · VINCI</div>
  <h1>Act before the stop</h1>
  <p>This deck is private. Enter the access code you received to open it.</p>
  <form id="f" autocomplete="off">
    <input id="c" aria-label="Access code" placeholder="XXXXX-XXXXX" spellcheck="false" autofocus>
    <button id="b" type="submit">Open</button>
  </form>
  <div id="err" role="alert"></div>
  <small>Questions: ger@madeos.ai</small>
</main>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function open_(code){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},k,u8(D.d)));
  try{sessionStorage.setItem('made_vinci_code',code)}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{
  e.preventDefault();if(!c.value.trim())return;
  b.disabled=true;err.textContent='';
  try{await open_(c.value)}catch(x){b.disabled=false;err.textContent='That code is not valid. Check it and try again.';c.select()}

(async()=>{
  const m=location.hash.match(/code=([^&]+)/);
  let saved=null;try{saved=sessionStorage.getItem('made_vinci_code')}catch(e){}
  const pre=m?decodeURIComponent(m[1]):saved;
  if(pre){if(m)history.replaceState(null,'',location.pathname);try{await open_(pre)}catch(x){try{sessionStorage.removeItem('made_vinci_code')}catch(e){}}}
